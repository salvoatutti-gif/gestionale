delete D.cat;delete D.isNew;const i=S.P.findIndex(p=>p.id==D.id);i<0?S.P.push(D):S.P[i]=D;sv();go('det',D.id)}
function filt(L){let r=L.filter(p=>(!F.q||(p.name+p.client).toLowerCase().includes(F.q.toLowerCase()))&&(!F.st||p.st==F.st)&&(!F.ty||p.ty==F.ty));return r.sort((a,b)=>F.o=='due'?(a.due||'9')>(b.due||'9')?1:-1:F.o=='cl'?a.client.localeCompare(b.client):(b.created>a.created?1:-1))}
const bar_=(L)=>`<div class="g" style="margin-bottom:10px"><input placeholder="Cerca…" value="${X(F.q)}" oninput="F.q=this.value;fl()"><select onchange="F.st=this.value;fl()"><option value="">Tutti gli stati</option>${ST.map(s=>`<option ${F.st==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="F.ty=this.value;fl()"><option value="">Tutte le tipologie</option>${TY.map(s=>`<option ${F.ty==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="F.o=this.value;fl()"><option value="due">Per consegna</option><option value="cl" ${F.o=='cl'?'selected':''}>Per cliente</option><option value="new" ${F.o=='new'?'selected':''}>Più recenti</option></select></div>`;

<div class="row" style="margin-top:6px"><b>${E(fee(p))}</b><small>${H(hrs(p))} / ${H(est(p))}</small>${p.st=='Concluso'?`<small>${E(rate(p))}/h · incassato ${E(paid(p))} · residuo ${E(rem(p))}</small><span class="bd" style="color:var(${pst(p)=='Pagato'?'--gr':'--am'})">${pst(p)}</span>`:`<span class="sp"></span>${ring(p)}`}</div></div>`}).join(''):'<p class="mu">Nessun progetto. Crea un nuovo lavoro dalla home.</p>'}
function list(){return nav('Lavori in corso')+bar_()+`<div id="ls">${rows(act())}</div>`}
function done(){const C=cl();return nav('Lavori conclusi')+`<div class="kp" style="margin-bottom:10px"><div><small>Valore</small><b>${E(C.reduce((a,p)=>a+fee(p),0))}</b></div><div><small>Incassato</small><b>${E(C.reduce((a,p)=>a+paid(p),0))}</b></div><div><small>Da incassare</small><b>${E(C.reduce((a,p)=>a+rem(p),0))}</b></div></div>`+bar_()+`<div id="ls">${rows(C)}</div>`}
function det(){const p=gp(V.id);if(!p)return home();const tm=S.timer&&S.timer.pid==p.id,fin=p.st=='Concluso',r=rate(p),df=hrs(p)-est(p);
return nav(X(p.name))+`<div class="card"><div class="row"><b class="sp">${X(p.client)} ${p.contact?'· '+X(p.contact):''}</b><small>N° ${p.num||'—'}</small></div><small>${X(p.ty)} · inizio ${dt(p.start)}${p.shoot?' · shooting '+dt(p.shoot):''} · consegna ${dt(p.due)}</small><p>${X(p.desc)}</p>
<div class="g"><div><label>Stato progetto</label><select onchange="setSt('${p.id}',this.value)">${ST.map(s=>`<option ${p.st==s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Stato preventivo</label><select onchange="gp('${p.id}').qs=this.value;sv();render()">${QS.map(s=>`<option ${p.qs==s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<div class="row" style="margin-top:10px"><button class="p" onclick="pdf('${p.id}')" title="Esporta PDF">📄 PDF</button><button onclick="cpy('${p.id}')" aria-label="Copia riepilogo" title="Copia riepilogo">📋</button><button onclick="editP('${p.id}')" aria-label="Modifica" title="Modifica">✎</button><button onclick="dup('${p.id}')" aria-label="Duplica" title="Duplica">⧉</button><button onclick="saveT('${p.id}')" aria-label="Salva come preset" title="Salva come preset">★</button><button onclick="delP('${p.id}')" aria-label="Elimina" title="Elimina" style="color:var(--ac)">🗑</button></div></div>
<div class="card"><h3>Economia</h3><div class="kp"><div><small>Compenso${p.vat?' (IVA escl.)':''}</small><b>${E(fee(p))}</b></div><div><small>Ore stimate / reali</small><b>${H(est(p))} / ${H(hrs(p))}</b><small>${hrs(p)?(df>0?'+':'')+H(df)+' vs stima':''}</small></div><div><small>€/h previsto</small><b>${E(est(p)?fee(p)/est(p):0)}</b></div><div><small>€/h ${fin?'effettivo':'provvisorio'} (lordo)</small><b>${hrs(p)>=.25?E(r):'—'}</b></div></div>${p.dv?`<small>Sconto applicato: ${E(dis(p))}</small>`:''}</div>
<div class="card"><div class="row"><h3 class="sp">Attività</h3><small>${prog(p)}%</small></div><div class="pb"><i style="width:${prog(p)}%"></i></div>${prog(p)==100&&p.tk.length&&p.st!='Concluso'?`<button class="p" style="width:100%;margin:8px 0" onclick="setSt('${p.id}','Concluso')">✓ Tutto fatto: segna come concluso</button>`:''}${p.tk.map((t,i)=>`<div class="tk"><input type="checkbox" ${t.d?'checked':''} onchange="tg('${p.id}',${i})"><input type="text" class="${t.d?'done':''}" value="${X(t.t)}" onchange="gp('${p.id}').tk[${i}].t=this.value;sv()"><span class="mvb"><button class="x" ${i?'':'disabled'} onclick="mv('${p.id}',${i},-1)" aria-label="Su">▲</button><button class="x" ${i<p.tk.length-1?'':'disabled'} onclick="mv('${p.id}',${i},1)" aria-label="Giù">▼</button></span><button class="x" onclick="gp('${p.id}').tk.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><input id="nt" placeholder="Nuova attività" style="flex:1" onkeydown="if(event.key=='Enter')addT('${p.id}')"><button onclick="addT('${p.id}')" aria-label="Aggiungi">＋</button></div></div>
<div class="card"><h3>Ore lavorate</h3><div class="row"><b id="tm" style="font-size:20px;min-width:80px">${tm?fmt(el()):'00:00:00'}</b>${tm?(S.timer.start?`<button onclick="tpause()">Pausa</button>`:`<button onclick="tstart('${p.id}')">Riprendi</button>`)+`<button class="r" onclick="tstop()">Termina</button>`:`<button onclick="tstart('${p.id}')">Avvia timer</button>`}</div>
<div class="g" style="margin-top:8px"><div><label>Data</label><input type="date" id="sd" value="${td()}"></div><div><label>Ore</label><input type="number" id="sh" min="0" step=".25"></div><div><label>Attività</label><select id="sk"><option value="">—</option>${p.tk.map(t=>`<option>${X(t.t)}</option>`).join('')}</select></div><div><label>Nota</label><input id="sn"></div></div><button style="margin-top:6px" onclick="addS('${p.id}')">＋ Ore</button>
${p.ses.map((s,i)=>`<div class="row" style="border-top:1px solid var(--ln);padding:4px 0"><small>${dt(s.date)}</small><b>${H(s.h)}</b><small class="sp">${X(s.task)} ${X(s.note)}</small><button class="x" onclick="gp('${p.id}').ses.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}</div>
<div class="card"><h3>Pagamenti</h3><div class="row"><span>Da pagare <b>${E(grand(p))}</b></span><span>Incassato <b>${E(paid(p))}</b></span><span class="${late(p)?'ov':''}">Residuo <b>${E(rem(p))}</b></span><span class="bd" style="color:var(${pst(p)=='Pagato'?'--gr':'--am'})">${pst(p)}</span>${late(p)?'<span class="bd ov">scaduto</span>':''}</div>
<div class="g" style="margin-top:8px"><div><label>Data</label><input type="date" id="pd" value="${td()}"></div><div><label>Importo (€)</label><input type="number" id="pa" min="0" step="any" value="${rem(p)||''}"></div><div><label>Scadenza saldo</label><input type="date" value="${p.pdue||''}" onchange="gp('${p.id}').pdue=this.value;sv();render()"></div></div><button style="margin-top:6px" onclick="addP('${p.id}')">＋ Pagamento</button>
${p.pay.map((s,i)=>`<div class="row" style="border-top:1px solid var(--ln);padding:4px 0"><small>${dt(s.date)}</small><b class="sp">${E(s.amt)}</b><button class="x" onclick="gp('${p.id}').pay.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}
${rem(p)>.005?`<h2>Messaggio di sollecito</h2><div class="row"><select id="mt" onchange="msg('${p.id}')" style="width:auto"><option value="i">Informale</option><option value="f">Professionale</option></select><button onclick="msg('${p.id}')">Genera</button></div><textarea id="mg" rows="4" style="margin-top:6px"></textarea><button onclick="navigator.clipboard.writeText($('mg').value).then(()=>this.textContent='Copiato ✓',()=>{$('mg').select();document.execCommand('copy')})">Copia</button>`:''}</div>`}

const tg=(id,i)=>{const t=gp(id).tk[i];t.d=t.d?0:1;sv();render()},addT=id=>{const v=$('nt').value.trim();if(v){gp(id).tk.push({t:v,d:0});sv();render();$('nt').focus()}};

const el=()=>S.timer.acc+(S.timer.start?Date.now()-S.timer.start:0),fmt=m=>{const s=Math.floor(m/1e3);return[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')},tick=()=>{if($('tm')&&S.timer)$('tm').textContent=fmt(el())};
const tstart=id=>{S.timer=S.timer&&S.timer.pid==id?{...S.timer,start:Date.now()}:{pid:id,acc:0,start:Date.now()};sv();render()},tpause=()=>{S.timer.acc=el();S.timer.start=0;sv();render()};

<p><small>Cliente</small><br><b>${X(p.client)}</b><br>${X(p.contact)}</p><h2 style="font-size:18px">${X(p.name)}</h2><p>${X(p.desc)}</p><table><tr><th>Servizio</th><th class="r">Importo</th></tr>${p.sv.map(v=>`<tr><td>${X(v.name)}</td><td class="r">${E(v.price)}</td></tr>`).join('')}</table>
<table style="width:50%;margin-left:50%"><tr><td>Subtotale</td><td class="r">${E(sub(p))}</td></tr>${dis(p)?`<tr><td>Sconto</td><td class="r">−${E(dis(p))}</td></tr>`:''}${+p.ex?`<tr><td>Spese</td><td class="r">${E(p.ex)}</td></tr>`:''}${p.vat?`<tr><td>Imponibile</td><td class="r">${E(fee(p))}</td></tr><tr><td>IVA ${p.vat}%</td><td class="r">${E(vat(p))}</td></tr>`:''}<tr><td><b>Totale</b></td><td class="r"><b style="font-size:16px">${E(grand(p))}</b></td></tr></table>
${p.due?`<p>Consegna prevista: ${dt(p.due)}${p.rev?` · Revisioni incluse: ${p.rev}`:''}</p>`:''}<p style="margin-top:20px"><small>${X(s.terms)}</small></p>`;setTimeout(()=>{try{window.print()}catch(e){toast('Stampa non disponibile: apri nel browser e scegli Salva come PDF')}},100)}
function stats(){const now=new Date(),y=now.getFullYear(),m=td().slice(0,7);const ok=d=>PER=='all'||(PER=='m'?d.slice(0,7)==m:PER=='3'?d>=new Date(Date.now()-90*864e5).toISOString().slice(0,10):d.slice(0,4)==y);
const pays=S.P.flatMap(p=>p.pay.map(x=>({...x,p}))).filter(x=>ok(x.date)),C=cl().filter(p=>ok(p.end||'')),all=S.P.filter(p=>p.ses.length),hh=S.P.reduce((a,p)=>a+hrs(p),0),fh=C.reduce((a,p)=>a+hrs(p),0);

return nav('Analisi')+`<button onclick="go('done')" style="margin-bottom:8px">Lavori conclusi e pagamenti →</button><div class="row" style="margin-bottom:8px">${[['m','Questo mese'],['3','Ultimi 3 mesi'],['y','Quest’anno'],['all','Tutto']].map(([k,l])=>`<button class="${PER==k?'p':''}" onclick="PER='${k}';render()">${l}</button>`).join('')}</div>
<div class="kp"><div><small>Futuri (da iniziare)</small><b>${S.P.filter(p=>p.st=='Da iniziare'&&p.qs!='rifiutato').length}</b><small>${E(S.P.filter(p=>p.st=='Da iniziare'&&p.qs=='accettato').reduce((a,p)=>a+fee(p),0))} accettati</small></div><div><small>In corso</small><b>${act().filter(p=>p.st!='Da iniziare').length}</b></div><div><small>Conclusi</small><b>${cl().length}</b><small>${E(C.reduce((a,p)=>a+fee(p),0))} nel periodo</small></div>
<div><small>Incassato nel periodo (lordo)</small><b>${E(pays.reduce((a,x)=>a+ +x.amt,0))}</b></div><div><small>Da incassare (totale)</small><b>${E(S.P.filter(p=>p.qs=='accettato'||p.st=='Concluso').reduce((a,p)=>a+rem(p),0))}</b></div><div><small>Ore lavorate</small><b>${H(hh)}</b></div><div><small>€/h medio lordo (conclusi)</small><b>${fh?E(C.reduce((a,p)=>a+fee(p),0)/fh):'—'}</b></div></div>

<h2>Ore stimate (blu) ed effettive (arancio)</h2><div class="card">${bars(all.map(p=>({l:p.name,v:est(p),w:hrs(p)})),H,1)}</div>

<h2>Progetti per tipologia</h2><div class="card">${bars(Object.keys(ty).map(k=>({l:k,v:ty[k]})),x=>x)}</div>`}
function settings(){const s=S.set;return nav('Impostazioni')+`<div class="card"><div class="g"><div><label>Nome professionale</label><input value="${X(s.name)}" oninput="S.set.name=this.value;sv()"></div><div><label>IVA predefinita % (0 = nessuna)</label><input type="number" min="0" value="${s.vat}" oninput="S.set.vat=+this.value;sv()"></div><div><label>Validità preventivo (giorni)</label><input type="number" min="0" value="${s.valid}" oninput="S.set.valid=+this.value;sv()"></div><div><label>Logo (piccolo)</label><input type="file" accept="image/*" onchange="logo(this)"></div></div>
<label>Contatti</label><textarea rows="2" oninput="S.set.contact=this.value;sv()">${X(s.contact)}</textarea><label>Condizioni e termini di pagamento</label><textarea rows="3" oninput="S.set.terms=this.value;sv()">${X(s.terms)}</textarea></div>

<div class="row" style="margin-top:8px"><input id="an" placeholder="Nuovo servizio" style="flex:2"><input id="ac" placeholder="Categoria" style="flex:1"><button onclick="S.cat.push({id:uid(),name:$('an').value||'Servizio',cat:$('ac').value||'Aggiuntivi',price:0,hours:0,on:1});sv();render()">Aggiungi</button></div></div>

function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.set.logo=r.result;sv()};r.readAsDataURL(f)}
render();
</script></body></html>
