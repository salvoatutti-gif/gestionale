<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Studio – gestionale</title>
<style>
:root{--bg:#eef0ec;--s:#fff;--ink:#14202b;--mu:#6b7684;--ln:#dde1dc;--ac:#e2483d;--bl:#2f6fdf;--gr:#23915a;--am:#d98a14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--s:#192330;--ink:#e8ecef;--mu:#8d98a6;--ln:#2a3645}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:980px;margin:auto;padding:14px}
h1{font-size:26px;margin:4px 0 14px;letter-spacing:-.02em}h2{font-size:17px;margin:18px 0 8px}h3{font-size:15px;margin:0 0 6px}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:6px}
.card{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:10px}
.hero{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.big{cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,border-color .15s;border-left:6px solid var(--c)}
.big:hover{transform:translateY(-2px);border-color:var(--c)}.big b{font-size:32px;letter-spacing:-.03em}
.kp{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.kp div{background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:10px}.kp b{display:block;font-size:20px}
small,.mu{color:var(--mu);font-size:12.5px}
button,.btn{font:inherit;border:1px solid var(--ln);background:var(--s);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}button.r{background:var(--ac);border-color:var(--ac);color:#fff}button.x{padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
input,select,textarea{font:inherit;width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px}
input[type=checkbox]{width:auto;accent-color:var(--ac)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}label{display:block;font-size:12.5px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.svc{display:grid;grid-template-columns:auto 1fr 84px 64px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid var(--ln)}
.bd{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.pb{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gr)}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px;margin:4px 0}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{height:12px;background:var(--ln);border-radius:6px;position:relative}.bar i{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--bl)}.bar i.b2{background:var(--am);height:50%;top:50%;border-radius:0 0 6px 6px}
.tk{display:flex;gap:8px;align-items:center;padding:3px 0}.tk input[type=text]{flex:1}.done{text-decoration:line-through;color:var(--mu)}
.tot{font-size:22px;font-weight:700}.ov{color:var(--ac)}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#111;background:#fff;font:13px/1.5 Georgia,serif;padding:10mm}#pr table{width:100%;border-collapse:collapse}#pr td,#pr th{padding:6px 4px;border-bottom:1px solid #ccc;text-align:left}#pr .r{text-align:right}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><div id="pr"></div>
<script>
const KEY='studio_v1',ST=['Da iniziare','In corso','In attesa materiali','In attesa revisione','Pronto per la consegna','Consegnato','In pausa','Concluso'],QS=['bozza','inviato','accettato','rifiutato'],TY=['Montaggio video','Videomaking','Fotografia','Altro'];
const SC={'Da iniziare':'--mu','In corso':'--bl','In attesa materiali':'--am','In attesa revisione':'--am','Pronto per la consegna':'--gr','Consegnato':'--gr','In pausa':'--mu','Concluso':'--gr'};
const C0=(c,l)=>l.map(([n,p,h])=>({id:Math.random().toString(36).slice(2,9),name:n,cat:c,price:p,hours:h,on:1}));
const D0=()=>({set:{name:'Il tuo nome',contact:'',logo:'',terms:'Pagamento: 30% all’accettazione, saldo alla consegna.',vat:0,valid:30,seq:0},
cat:[...C0('Montaggio video',[['Selezione e organizzazione del girato',60,2],['Montaggio video principale',250,8],['Versione lunga',120,4],['Versione corta',50,2],['Reel / clip verticali',70,2],['Adattamento verticale',30,1],['Color correction',60,2],['Color grading avanzato',120,4],['Sincronizzazione audio',40,1],['Sound design',90,3],['Pulizia audio',50,2],['Sottotitoli',50,2],['Grafiche',40,2],['Motion graphics',150,5],['Titoli e lower thirds',40,1],['Trailer / teaser',80,3],['Esportazione formati',20,1],['Revisione aggiuntiva',40,1]]),
...C0('Videomaking',[['Mezza giornata di riprese',300,5],['Giornata intera di riprese',550,9],['Attrezzatura aggiuntiva',80,0],['Interviste',200,4],['Riprese di evento',400,7],['Riprese di prodotto',250,5],['Trasferta / spese viaggio',0,0]]),
...C0('Fotografia',[['Servizio fotografico',250,4],['Foto di prodotto',200,4],['Foto di evento',350,6],['Selezione scatti',50,2],['Post-produzione',100,4],['Ritocco avanzato',120,4]]),
...C0('Aggiuntivi',[['Urgenza nella consegna',100,0],['Revisioni extra',40,1],['Licenze / costi aggiuntivi',0,0]])],P:[],timer:null});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.P)S=D0();
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const E=n=>(+n||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €',H=n=>(+n||0).toLocaleString('it-IT',{maximumFractionDigits:1})+' h';
const X=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,10),td=()=>new Date().toISOString().slice(0,10);
const dt=d=>d?new Date(d).toLocaleDateString('it-IT'):'—',$=id=>document.getElementById(id),gp=id=>S.P.find(p=>p.id==id);
const sub=p=>p.sv.reduce((a,s)=>a+(+s.price||0),0),dis=p=>p.dt=='%'?sub(p)*(+p.dv||0)/100:(+p.dv||0),fee=p=>Math.max(0,sub(p)-dis(p)+(+p.ex||0)),vat=p=>fee(p)*(+p.vat||0)/100,grand=p=>fee(p)+vat(p);
const hrs=p=>p.ses.reduce((a,s)=>a+(+s.h||0),0),est=p=>+p.est||p.sv.reduce((a,s)=>a+(+s.hours||0),0),paid=p=>p.pay.reduce((a,s)=>a+(+s.amt||0),0),rem=p=>Math.max(0,grand(p)-paid(p));
const rate=p=>hrs(p)>0?fee(p)/hrs(p):0,prog=p=>p.tk.length?Math.round(100*p.tk.filter(t=>t.d).length/p.tk.length):0;
const pst=p=>paid(p)>=grand(p)-.005&&grand(p)>0?'Pagato':paid(p)>0?'Parzialmente pagato':'Non pagato',late=p=>rem(p)>.005&&p.pdue&&p.pdue<td();
let V={v:'home'},D=null,F={q:'',st:'',ty:'',o:'due'},PER='all',tmr;
const go=(v,id)=>{V={v,id};render();scrollTo(0,0)};
const bd=s=>`<span class="bd" style="color:var(${SC[s]||'--mu'})">${X(s)}</span>`;
const nav=(t,back)=>`<div class="top"><button onclick="go('home')">← Home</button><b>${t||''}</b><span class="row"><button onclick="go('stats')">Analisi</button><button onclick="go('set')">Impostazioni</button></span></div>`;
function render(){clearInterval(tmr);const a=$('app'),v=V.v;a.innerHTML=({home,new:form,list,done,det,stats,set:settings}[v])();if(v=='det'&&S.timer)tmr=setInterval(tick,1000);if(v=='new')upd()}
const act=()=>S.P.filter(p=>p.st!='Concluso'&&p.qs!='rifiutato'),cl=()=>S.P.filter(p=>p.st=='Concluso');
function home(){const A=act(),C=cl(),m=td().slice(0,7),hm=S.P.reduce((a,p)=>a+p.ses.filter(s=>s.date.slice(0,7)==m).reduce((x,s)=>x+s.h,0),0),inc=S.P.reduce((a,p)=>a+paid(p),0),da=S.P.filter(p=>p.qs=='accettato'||p.st=='Concluso').reduce((a,p)=>a+rem(p),0);
return`<h1>${X(S.set.name)}</h1><div class="hero">
<div class="card big" style="--c:var(--ac)" onclick="newP()"><div><h3>Nuovo lavoro / Preventivi</h3><small>Cliente, servizi, prezzo, PDF</small></div><b>+ Crea</b></div>
<div class="card big" style="--c:var(--bl)" onclick="go('list')"><div><h3>Lavori in corso</h3><small>Futuri e in lavorazione</small></div><div><b>${A.length}</b> <small>${E(A.reduce((a,p)=>a+fee(p),0))}</small></div></div>
<div class="card big" style="--c:var(--gr)" onclick="go('done')"><div><h3>Lavori conclusi / Pagamenti</h3><small>Incassi e saldi</small></div><div><b>${C.length}</b> <small>${E(C.reduce((a,p)=>a+rem(p),0))} da incassare</small></div></div></div>
<h2>Riepilogo</h2><div class="kp"><div><small>Valore lavori attivi</small><b>${E(A.reduce((a,p)=>a+fee(p),0))}</b></div><div><small>Incassato (lordo)</small><b>${E(inc)}</b></div><div><small>Da incassare</small><b>${E(da)}</b></div><div><small>Ore questo mese</small><b>${H(hm)}</b></div></div>`}
function newP(){D={id:uid(),sv:[],tk:[],ses:[],pay:[],qs:'bozza',st:'Da iniziare',ty:'Montaggio video',created:td(),dt:'%',dv:0,ex:0,vat:S.set.vat,est:'',cat:S.cat.filter(c=>c.on).map(c=>({...c,on:0})),isNew:1};go('new')}
function editP(id){const p=JSON.parse(JSON.stringify(gp(id)));const have=p.sv.map(s=>s.name);p.cat=[...p.sv.map(s=>({...s,on:1})),...S.cat.filter(c=>c.on&&!have.includes(c.name)).map(c=>({...c,on:0}))];D=p;go('new')}
function form(){const cats=[...new Set(D.cat.map(c=>c.cat))];
return nav(D.isNew?'Nuovo preventivo':'Modifica')+`<div class="card"><div class="g">
${[['client','Cliente / azienda'],['contact','Email o recapito'],['name','Nome progetto']].map(([k,l])=>`<div><label>${l}</label><input value="${X(D[k])}" oninput="D.${k}=this.value;upd()"></div>`).join('')}
<div><label>Tipologia</label><select onchange="D.ty=this.value">${TY.map(t=>`<option ${t==D.ty?'selected':''}>${t}</option>`).join('')}</select></div>
${[['created','Data preventivo'],['start','Inizio previsto'],['due','Consegna prevista'],['pdue','Scadenza pagamento']].map(([k,l])=>`<div><label>${l}</label><input type="date" value="${D[k]||''}" oninput="D.${k}=this.value"></div>`).join('')}
<div><label>Revisioni incluse</label><input type="number" min="0" value="${D.rev||''}" oninput="D.rev=this.value"></div>
<div><label>Ore stimate (vuoto = somma servizi)</label><input type="number" min="0" step=".5" value="${D.est}" oninput="D.est=this.value;upd()"></div></div>
<label style="margin-top:8px">Descrizione</label><textarea rows="2" oninput="D.desc=this.value">${X(D.desc)}</textarea><label>Note interne</label><textarea rows="2" oninput="D.notes=this.value">${X(D.notes)}</textarea></div>
<div class="card"><h3>Servizi</h3><small>Spunta e modifica prezzo/ore: valgono solo per questo lavoro.</small>
${cats.map(c=>`<h2>${X(c)}</h2>`+D.cat.map((s,i)=>s.cat==c?`<div class="svc"><input type="checkbox" ${s.on?'checked':''} onchange="D.cat[${i}].on=this.checked?1:0;upd()"><span>${X(s.name)}</span><input type="number" min="0" step="any" value="${s.price}" aria-label="Prezzo" oninput="D.cat[${i}].price=+this.value;upd()"><input type="number" min="0" step=".5" value="${s.hours}" aria-label="Ore" oninput="D.cat[${i}].hours=+this.value;upd()"></div>`:'').join('')).join('')}
<h2>Servizio personalizzato</h2><div class="row"><input id="cn" placeholder="Nome" style="flex:2"><input id="cp" type="number" placeholder="€" style="flex:1"><button onclick="addC()">Aggiungi</button></div></div>
<div class="card"><div class="g"><div><label>Sconto</label><div class="row"><select style="width:70px" onchange="D.dt=this.value;upd()"><option ${D.dt=='%'?'selected':''}>%</option><option ${D.dt=='€'?'selected':''}>€</option></select><input type="number" min="0" step="any" value="${D.dv}" oninput="D.dv=+this.value;upd()" style="flex:1"></div></div>
<div><label>Spese / maggiorazioni (€)</label><input type="number" min="0" step="any" value="${D.ex}" oninput="D.ex=+this.value;upd()"></div><div><label>IVA % (0 = nessuna)</label><input type="number" min="0" step="any" value="${D.vat}" oninput="D.vat=+this.value;upd()"></div></div>
<div id="tt" style="margin-top:10px"></div></div>
<div class="row"><button class="p" onclick="saveP()">Salva preventivo</button><button onclick="go(D.isNew?'home':'det',D.id)">Annulla</button></div>`}
function addC(){const n=$('cn').value.trim();if(!n)return;D.cat.push({id:uid(),name:n,cat:'Personalizzati',price:+$('cp').value||0,hours:0,on:1});form_();}
const form_=()=>{const y=scrollY;render();scrollTo(0,y)};
function upd(){const el=$('tt');if(!el)return;const p={...D,sv:D.cat.filter(c=>c.on)};el.innerHTML=`<div class="row"><small>Subtotale</small><b>${E(sub(p))}</b><small>Sconto</small><b>−${E(dis(p))}</b></div><div class="tot">Totale ${E(fee(p))}</div>${p.vat?`<small>IVA ${p.vat}%: ${E(vat(p))} → da pagare ${E(grand(p))}</small><br>`:''}<small>Ore stimate ${H(est(p))} → <b>${E(est(p)?fee(p)/est(p):0)}/h</b> lordi previsti</small>`}
function saveP(){if(!D.cat.some(c=>c.on)&&!confirm('Nessun servizio selezionato. Salvare comunque?'))return;D.sv=D.cat.filter(c=>c.on).map(({name,cat,price,hours})=>({name,cat,price:+price||0,hours:+hours||0}));
if(!D.client)D.client='Cliente';if(!D.name)D.name='Progetto senza nome';if(D.isNew){D.num=new Date().getFullYear()+'-'+String(++S.set.seq).padStart(3,'0');D.tk=['Ricezione del materiale',...D.sv.map(s=>s.name),'Consegna al cliente'].map(t=>({t,d:0}))}
delete D.cat;delete D.isNew;const i=S.P.findIndex(p=>p.id==D.id);i<0?S.P.push(D):S.P[i]=D;sv();go('det',D.id)}
function filt(L){let r=L.filter(p=>(!F.q||(p.name+p.client).toLowerCase().includes(F.q.toLowerCase()))&&(!F.st||p.st==F.st)&&(!F.ty||p.ty==F.ty));return r.sort((a,b)=>F.o=='due'?(a.due||'9')>(b.due||'9')?1:-1:F.o=='cl'?a.client.localeCompare(b.client):(b.created>a.created?1:-1))}
const bar_=(L)=>`<div class="g" style="margin-bottom:10px"><input placeholder="Cerca…" value="${X(F.q)}" oninput="F.q=this.value;fl()"><select onchange="F.st=this.value;fl()"><option value="">Tutti gli stati</option>${ST.map(s=>`<option ${F.st==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="F.ty=this.value;fl()"><option value="">Tutte le tipologie</option>${TY.map(s=>`<option ${F.ty==s?'selected':''}>${s}</option>`).join('')}</select><select onchange="F.o=this.value;fl()"><option value="due">Per consegna</option><option value="cl" ${F.o=='cl'?'selected':''}>Per cliente</option><option value="new" ${F.o=='new'?'selected':''}>Più recenti</option></select></div>`;
const fl=()=>{$('ls').innerHTML=rows(V.v=='list'?act():cl())};
function rows(L){L=filt(L);return L.length?L.map(p=>{const soon=p.due&&p.st!='Concluso'&&p.due<=new Date(Date.now()+3*864e5).toISOString().slice(0,10);return`<div class="card" style="cursor:pointer" onclick="go('det','${p.id}')"><div class="row"><b class="sp">${X(p.name)}</b>${bd(p.st)}${p.qs!='accettato'?`<span class="bd mu">${p.qs}</span>`:''}${soon?'<span class="bd ov">scade presto</span>':''}${late(p)?'<span class="bd ov">pagamento scaduto</span>':''}</div><small>${X(p.client)} · ${X(p.ty)} · ${p.st=='Concluso'?'concluso '+dt(p.end):'inizio '+dt(p.start)+' · consegna '+dt(p.due)}</small>
<div class="row" style="margin-top:6px"><b>${E(fee(p))}</b><small>${H(hrs(p))} / ${H(est(p))}</small>${p.st=='Concluso'?`<small>${E(rate(p))}/h · incassato ${E(paid(p))} · residuo ${E(rem(p))}</small><span class="bd" style="color:var(${pst(p)=='Pagato'?'--gr':'--am'})">${pst(p)}</span>`:`<span class="sp"></span><small>${prog(p)}%</small>`}</div>${p.st!='Concluso'?`<div class="pb" style="margin-top:6px"><i style="width:${prog(p)}%"></i></div>`:''}</div>`}).join(''):'<p class="mu">Nessun progetto. Crea un nuovo lavoro dalla home.</p>'}
function list(){return nav('Lavori in corso')+bar_()+`<div id="ls">${rows(act())}</div>`}
function done(){const C=cl();return nav('Lavori conclusi')+`<div class="kp" style="margin-bottom:10px"><div><small>Valore</small><b>${E(C.reduce((a,p)=>a+fee(p),0))}</b></div><div><small>Incassato</small><b>${E(C.reduce((a,p)=>a+paid(p),0))}</b></div><div><small>Da incassare</small><b>${E(C.reduce((a,p)=>a+rem(p),0))}</b></div></div>`+bar_()+`<div id="ls">${rows(C)}</div>`}
function det(){const p=gp(V.id);if(!p)return home();const tm=S.timer&&S.timer.pid==p.id,fin=p.st=='Concluso',r=rate(p),df=hrs(p)-est(p);
return nav(X(p.name))+`<div class="card"><div class="row"><b class="sp">${X(p.client)} ${p.contact?'· '+X(p.contact):''}</b><small>N° ${p.num||'—'}</small></div><small>${X(p.ty)} · inizio ${dt(p.start)} · consegna ${dt(p.due)}</small><p>${X(p.desc)}</p>
<div class="g"><div><label>Stato progetto</label><select onchange="setSt('${p.id}',this.value)">${ST.map(s=>`<option ${p.st==s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Stato preventivo</label><select onchange="gp('${p.id}').qs=this.value;sv();render()">${QS.map(s=>`<option ${p.qs==s?'selected':''}>${s}</option>`).join('')}</select></div></div>
<div class="row" style="margin-top:10px"><button class="p" onclick="pdf('${p.id}')">Esporta PDF</button><button onclick="editP('${p.id}')">Modifica</button><button onclick="dup('${p.id}')">Duplica</button><button onclick="if(confirm('Eliminare il progetto?')){S.P=S.P.filter(x=>x.id!='${p.id}');sv();go('home')}">Elimina</button></div></div>
<div class="card"><h3>Economia</h3><div class="kp"><div><small>Compenso${p.vat?' (IVA escl.)':''}</small><b>${E(fee(p))}</b></div><div><small>Ore stimate / reali</small><b>${H(est(p))} / ${H(hrs(p))}</b><small>${hrs(p)?(df>0?'+':'')+H(df)+' vs stima':''}</small></div><div><small>€/h previsto</small><b>${E(est(p)?fee(p)/est(p):0)}</b></div><div><small>€/h ${fin?'effettivo':'provvisorio'} (lordo)</small><b>${r?E(r):'—'}</b></div></div>${p.dv?`<small>Sconto applicato: ${E(dis(p))}</small>`:''}</div>
<div class="card"><div class="row"><h3 class="sp">Attività</h3><small>${prog(p)}%</small></div><div class="pb"><i style="width:${prog(p)}%"></i></div>${p.tk.map((t,i)=>`<div class="tk"><input type="checkbox" ${t.d?'checked':''} onchange="tg('${p.id}',${i})"><input type="text" class="${t.d?'done':''}" value="${X(t.t)}" onchange="gp('${p.id}').tk[${i}].t=this.value;sv()"><button class="x" onclick="gp('${p.id}').tk.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><input id="nt" placeholder="Nuova attività" style="flex:1"><button onclick="addT('${p.id}')">Aggiungi</button></div></div>
<div class="card"><h3>Ore lavorate</h3><div class="row"><b id="tm" style="font-size:20px;min-width:80px">${tm?fmt(el()):'00:00:00'}</b>${tm?(S.timer.start?`<button onclick="tpause()">Pausa</button>`:`<button onclick="tstart('${p.id}')">Riprendi</button>`)+`<button class="r" onclick="tstop()">Termina</button>`:`<button onclick="tstart('${p.id}')">Avvia timer</button>`}</div>
<div class="g" style="margin-top:8px"><div><label>Data</label><input type="date" id="sd" value="${td()}"></div><div><label>Ore</label><input type="number" id="sh" min="0" step=".25"></div><div><label>Attività</label><select id="sk"><option value="">—</option>${p.tk.map(t=>`<option>${X(t.t)}</option>`).join('')}</select></div><div><label>Nota</label><input id="sn"></div></div><button style="margin-top:6px" onclick="addS('${p.id}')">Registra ore</button>
${p.ses.map((s,i)=>`<div class="row" style="border-top:1px solid var(--ln);padding:4px 0"><small>${dt(s.date)}</small><b>${H(s.h)}</b><small class="sp">${X(s.task)} ${X(s.note)}</small><button class="x" onclick="gp('${p.id}').ses.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}</div>
<div class="card"><h3>Pagamenti</h3><div class="row"><span>Da pagare <b>${E(grand(p))}</b></span><span>Incassato <b>${E(paid(p))}</b></span><span class="${late(p)?'ov':''}">Residuo <b>${E(rem(p))}</b></span><span class="bd" style="color:var(${pst(p)=='Pagato'?'--gr':'--am'})">${pst(p)}</span>${late(p)?'<span class="bd ov">scaduto</span>':''}</div>
<div class="g" style="margin-top:8px"><div><label>Data</label><input type="date" id="pd" value="${td()}"></div><div><label>Importo (€)</label><input type="number" id="pa" min="0" step="any" value="${rem(p)||''}"></div><div><label>Scadenza saldo</label><input type="date" value="${p.pdue||''}" onchange="gp('${p.id}').pdue=this.value;sv();render()"></div></div><button style="margin-top:6px" onclick="addP('${p.id}')">Registra pagamento</button>
${p.pay.map((s,i)=>`<div class="row" style="border-top:1px solid var(--ln);padding:4px 0"><small>${dt(s.date)}</small><b class="sp">${E(s.amt)}</b><button class="x" onclick="gp('${p.id}').pay.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></div>`).join('')}
${rem(p)>.005?`<h2>Messaggio di sollecito</h2><div class="row"><select id="mt" onchange="msg('${p.id}')" style="width:auto"><option value="i">Informale</option><option value="f">Professionale</option></select><button onclick="msg('${p.id}')">Genera</button></div><textarea id="mg" rows="4" style="margin-top:6px"></textarea><button onclick="navigator.clipboard.writeText($('mg').value).then(()=>this.textContent='Copiato ✓',()=>{$('mg').select();document.execCommand('copy')})">Copia</button>`:''}</div>`}
function setSt(id,s){const p=gp(id);p.st=s;if(s=='Concluso'){p.end=td();p.tk.forEach(t=>t.d=1);sv();go('done')}else{p.end='';sv();render()}}
const tg=(id,i)=>{const t=gp(id).tk[i];t.d=t.d?0:1;sv();render()},addT=id=>{const v=$('nt').value.trim();if(v){gp(id).tk.push({t:v,d:0});sv();render()}};
function addS(id){const h=+$('sh').value;if(!(h>0))return alert('Inserisci ore valide (maggiori di 0).');gp(id).ses.push({date:$('sd').value||td(),h,task:$('sk').value,note:$('sn').value});sv();render()}
function addP(id){const a=+$('pa').value;if(!(a>0))return alert('Inserisci un importo valido.');const p=gp(id);p.pay.push({date:$('pd').value||td(),amt:a});sv();render()}
function dup(id){const p=JSON.parse(JSON.stringify(gp(id)));Object.assign(p,{id:uid(),name:p.name+' (copia)',qs:'bozza',st:'Da iniziare',ses:[],pay:[],end:'',created:td(),num:new Date().getFullYear()+'-'+String(++S.set.seq).padStart(3,'0')});p.tk.forEach(t=>t.d=0);S.P.push(p);sv();go('det',p.id)}
function msg(id){const p=gp(id),n=(p.client||'').split(' ')[0],t=$('mt').value,d=p.pdue?` (scadenza concordata: ${dt(p.pdue)})`:'';$('mg').value=t=='i'?`Ciao ${n}, ti scrivo per un aggiornamento sul pagamento relativo al progetto ${p.name}. L’importo ancora da saldare è di ${E(rem(p))}${d}. Quando riesci, fammi sapere quando prevedi di effettuare il pagamento. Grazie!`:`Gentile ${p.client}, con la presente Le ricordo il pagamento relativo al progetto “${p.name}”${d}. Il saldo residuo è pari a ${E(rem(p))}. Resto a disposizione per qualsiasi chiarimento. Cordiali saluti, ${S.set.name}`}
const el=()=>S.timer.acc+(S.timer.start?Date.now()-S.timer.start:0),fmt=m=>{const s=Math.floor(m/1e3);return[s/3600|0,s/60%60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')},tick=()=>{if($('tm')&&S.timer)$('tm').textContent=fmt(el())};
const tstart=id=>{S.timer=S.timer&&S.timer.pid==id?{...S.timer,start:Date.now()}:{pid:id,acc:0,start:Date.now()};sv();render()},tpause=()=>{S.timer.acc=el();S.timer.start=0;sv();render()};
function tstop(){const h=Math.round(el()/36e3)/100,id=S.timer.pid;S.timer=null;if(h>0)gp(id).ses.push({date:td(),h,task:'',note:'Timer'});sv();render()}
function pdf(id){const p=gp(id),s=S.set;$('pr').innerHTML=`<div style="display:flex;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:8px"><div>${s.logo?`<img src="${s.logo}" style="max-height:60px"><br>`:''}<b style="font-size:20px">${X(s.name)}</b><br>${X(s.contact).replace(/\n/g,'<br>')}</div><div style="text-align:right"><b style="font-size:20px">PREVENTIVO</b><br>N° ${p.num||'—'}<br>Data ${dt(p.created)}${s.valid?`<br>Valido fino al ${dt(new Date(new Date(p.created).getTime()+s.valid*864e5))}`:''}</div></div>
<p><small>Cliente</small><br><b>${X(p.client)}</b><br>${X(p.contact)}</p><h2 style="font-size:18px">${X(p.name)}</h2><p>${X(p.desc)}</p><table><tr><th>Servizio</th><th class="r">Importo</th></tr>${p.sv.map(v=>`<tr><td>${X(v.name)}</td><td class="r">${E(v.price)}</td></tr>`).join('')}</table>
<table style="width:50%;margin-left:50%"><tr><td>Subtotale</td><td class="r">${E(sub(p))}</td></tr>${dis(p)?`<tr><td>Sconto</td><td class="r">−${E(dis(p))}</td></tr>`:''}${+p.ex?`<tr><td>Spese</td><td class="r">${E(p.ex)}</td></tr>`:''}${p.vat?`<tr><td>Imponibile</td><td class="r">${E(fee(p))}</td></tr><tr><td>IVA ${p.vat}%</td><td class="r">${E(vat(p))}</td></tr>`:''}<tr><td><b>Totale</b></td><td class="r"><b style="font-size:16px">${E(grand(p))}</b></td></tr></table>
${p.due?`<p>Consegna prevista: ${dt(p.due)}${p.rev?` · Revisioni incluse: ${p.rev}`:''}</p>`:''}<p style="margin-top:20px"><small>${X(s.terms)}</small></p>`;setTimeout(()=>{try{window.print()}catch(e){alert('Stampa non disponibile qui: apri la pagina nel browser e scegli Salva come PDF.')}},100)}
function stats(){const now=new Date(),y=now.getFullYear(),m=td().slice(0,7);const ok=d=>PER=='all'||(PER=='m'?d.slice(0,7)==m:PER=='3'?d>=new Date(Date.now()-90*864e5).toISOString().slice(0,10):d.slice(0,4)==y);
const pays=S.P.flatMap(p=>p.pay.map(x=>({...x,p}))).filter(x=>ok(x.date)),C=cl().filter(p=>ok(p.end||'')),all=S.P.filter(p=>p.ses.length),hh=S.P.reduce((a,p)=>a+hrs(p),0),fh=C.reduce((a,p)=>a+hrs(p),0);
const bars=(it,f,two)=>{const mx=Math.max(1,...it.map(i=>Math.max(i.v,i.w||0)));return it.length?it.map(i=>`<div class="bar"><span title="${X(i.l)}">${X(i.l)}</span><div><i style="width:${i.v/mx*100}%"></i>${two?`<i class="b2" style="width:${(i.w||0)/mx*100}%"></i>`:''}</div><b>${f(i.v)}</b></div>`).join(''):'<p class="mu">Nessun dato nel periodo.</p>'};
const mo={};pays.forEach(x=>mo[x.date.slice(0,7)]=(mo[x.date.slice(0,7)]||0)+ +x.amt);const ty={};S.P.forEach(p=>ty[p.ty]=(ty[p.ty]||0)+1);
return nav('Analisi')+`<div class="row" style="margin-bottom:8px">${[['m','Questo mese'],['3','Ultimi 3 mesi'],['y','Quest’anno'],['all','Tutto']].map(([k,l])=>`<button class="${PER==k?'p':''}" onclick="PER='${k}';render()">${l}</button>`).join('')}</div>
<div class="kp"><div><small>Futuri (da iniziare)</small><b>${S.P.filter(p=>p.st=='Da iniziare'&&p.qs!='rifiutato').length}</b><small>${E(S.P.filter(p=>p.st=='Da iniziare'&&p.qs=='accettato').reduce((a,p)=>a+fee(p),0))} accettati</small></div><div><small>In corso</small><b>${act().filter(p=>p.st!='Da iniziare').length}</b></div><div><small>Conclusi</small><b>${cl().length}</b><small>${E(C.reduce((a,p)=>a+fee(p),0))} nel periodo</small></div>
<div><small>Incassato nel periodo (lordo)</small><b>${E(pays.reduce((a,x)=>a+ +x.amt,0))}</b></div><div><small>Da incassare (totale)</small><b>${E(S.P.filter(p=>p.qs=='accettato'||p.st=='Concluso').reduce((a,p)=>a+rem(p),0))}</b></div><div><small>Ore lavorate</small><b>${H(hh)}</b></div><div><small>€/h medio lordo (conclusi)</small><b>${fh?E(C.reduce((a,p)=>a+fee(p),0)/fh):'—'}</b></div></div>
<small>Importi lordi: nessuna imposta, contributo o costo è dedotto. Gli incassi usano la data del pagamento.</small>
<h2>Incassi per mese</h2><div class="card">${bars(Object.keys(mo).sort().map(k=>({l:k,v:mo[k]})),E)}</div>
<h2>Ore stimate (blu) ed effettive (arancio)</h2><div class="card">${bars(all.map(p=>({l:p.name,v:est(p),w:hrs(p)})),H,1)}</div>
<h2>Guadagno orario lordo per progetto</h2><div class="card">${bars(all.map(p=>({l:p.name,v:rate(p)})),E)}</div>
<h2>Progetti per tipologia</h2><div class="card">${bars(Object.keys(ty).map(k=>({l:k,v:ty[k]})),x=>x)}</div>`}
function settings(){const s=S.set;return nav('Impostazioni')+`<div class="card"><div class="g"><div><label>Nome professionale</label><input value="${X(s.name)}" oninput="S.set.name=this.value;sv()"></div><div><label>IVA predefinita % (0 = nessuna)</label><input type="number" min="0" value="${s.vat}" oninput="S.set.vat=+this.value;sv()"></div><div><label>Validità preventivo (giorni)</label><input type="number" min="0" value="${s.valid}" oninput="S.set.valid=+this.value;sv()"></div><div><label>Logo (piccolo)</label><input type="file" accept="image/*" onchange="logo(this)"></div></div>
<label>Contatti</label><textarea rows="2" oninput="S.set.contact=this.value;sv()">${X(s.contact)}</textarea><label>Condizioni e termini di pagamento</label><textarea rows="3" oninput="S.set.terms=this.value;sv()">${X(s.terms)}</textarea></div>
<div class="card"><h3>Catalogo servizi</h3><small>Le modifiche non cambiano i preventivi già creati. Colonne: nome, prezzo, ore, attivo.</small>${S.cat.map((c,i)=>`<div class="svc" style="grid-template-columns:1fr 80px 56px auto"><input value="${X(c.name)}" onchange="S.cat[${i}].name=this.value;sv()"><input type="number" min="0" value="${c.price}" onchange="S.cat[${i}].price=+this.value;sv()"><input type="number" min="0" step=".5" value="${c.hours}" onchange="S.cat[${i}].hours=+this.value;sv()"><span class="row"><input type="checkbox" ${c.on?'checked':''} onchange="S.cat[${i}].on=this.checked?1:0;sv()"><button class="x" onclick="S.cat.splice(${i},1);sv();render()" aria-label="Elimina">✕</button></span></div>`).join('')}
<div class="row" style="margin-top:8px"><input id="an" placeholder="Nuovo servizio" style="flex:2"><input id="ac" placeholder="Categoria" style="flex:1"><button onclick="S.cat.push({id:uid(),name:$('an').value||'Servizio',cat:$('ac').value||'Aggiuntivi',price:0,hours:0,on:1});sv();render()">Aggiungi</button></div></div>
<div class="card"><h3>Backup dati</h3><small>I dati sono salvati in questo browser. Copia il backup e conservalo (Note, email). Per ripristinare, incolla e importa.</small><textarea id="bk" rows="4" style="margin-top:6px"></textarea><div class="row" style="margin-top:6px"><button onclick="$('bk').value=JSON.stringify(S);$('bk').select();document.execCommand('copy')">Copia backup</button><button onclick="try{const d=JSON.parse($('bk').value);if(!d.P)throw 0;if(confirm('Sostituire tutti i dati attuali?')){S=d;sv();go('home')}}catch(e){alert('Backup non valido.')}">Importa</button></div></div>`}
function logo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.set.logo=r.result;sv()};r.readAsDataURL(f)}
render();
</script></body></html>
